# Dependabot：每周检查依赖与 Actions 更新
# - npm 的 minor/patch 合并成一个 PR，减少噪音；major 单独开
# - Next / React / 测试工具链的 major 暂时忽略，升级需要人工评估
# - Dependabot 分支的 Vercel 预览部署由 vercel.json 关闭（见 git.deploymentEnabled）
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:17"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: next
        update-types:
          - version-update:semver-major
      - dependency-name: react
        update-types:
          - version-update:semver-major
      - dependency-name: react-dom
        update-types:
          - version-update:semver-major
      # 测试工具链 major 之间存在 peer 约束（vitest 5 ↔ coverage-v8 4 ↔ jest-dom 8），
      # 自动升级会产生无法安装的 PR；需要时人工一起升级。
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitest/coverage-v8"
        update-types:
          - version-update:semver-major
      - dependency-name: "@testing-library/jest-dom"
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:17"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
