name: 定时数据库备份

on:
  # 每周一 02:17 UTC（≈ 北京时间周二 10:17，错开整点避免集群高峰）
  schedule:
    - cron: "17 2 * * 1"
  # 支持手动触发：Actions → 定时数据库备份 → Run workflow
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 执行备份（导出全表 JSON 到 backups/）
        env:
          # CI 无 .env.local，脚本会回退读取环境变量
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/backup.mjs

      - name: 上传备份产物（保留 90 天）
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backups/*.json
          retention-days: 90
          if-no-files-found: error
